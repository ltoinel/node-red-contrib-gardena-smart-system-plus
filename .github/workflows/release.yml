name: Release

# Publish to npm when a version tag (e.g. v1.2.0) is pushed.
# Workflow: bump with `npm version patch|minor|major`, then `git push --follow-tags`.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance / trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Check whether this version is already on npm
        id: npm
        run: |
          SPEC="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "::notice::$SPEC is already published (e.g. by hand): skipping npm publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          # Not needed once npm trusted publishing is configured for this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
