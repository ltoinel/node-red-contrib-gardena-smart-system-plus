<script type="text/html" data-help-name="devices_status">
    <p>Retrieves the status of all devices, for every location of the Gardena Smart System account.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">

<script type="text/html" data-help-name="gardena_events">
    <p>Outputs the state changes of the Gardena devices in realtime, as soon as they happen (mower activity,
    valve opened or closed, sensor values, battery, radio link...).</p>
    <p>Prefer this node to polling the Gardena Devices Status node: the events are pushed by the Gardena API
    through a WebSocket, which uses almost none of the API quota. Right after connecting, the current state
    of every device and service is sent.</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The complete state of the service, device or location that changed, with the same shape as in the
        Devices Status output (<code>id</code>, <code>type</code> and its attributes, e.g. <code>activity.value</code>).
        The API sends partial updates: they are merged into the state received since the connection opened.</dd>
        <dt>changed <span class="property-type">array</span></dt>
        <dd>Names of the attributes present in this update, e.g. <code>["activity"]</code>.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>gardena/&lt;type&gt;/&lt;id&gt;</code></dd>
        <dt>eventType <span class="property-type">string</span></dt>
        <dd>The resource type: <code>MOWER</code>, <code>VALVE</code>, <code>SENSOR</code>, <code>DEVICE</code>...</dd>
        <dt>deviceId <span class="property-type">string</span></dt>
        <dd>The ID of the device the resource belongs to, when known.</dd>
    </dl>
    <h3>Details</h3>
    <p>All the Events nodes using the same credentials share one connection per location. When the connection
    is lost, it is re-established automatically: quickly at first, then once per hour, to stay within the
    Gardena API quota. The connection is kept alive with a ping every 150 seconds and renewed every 110 minutes,
    before the API closes it (2 hours maximum).</p>
</script>
